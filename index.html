<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURPRISE</title>
    <link ref="stylesheet" href="style.css">
</head>
<style>
    .boxcontainer {
        width: 90vw;
        margin: 0 auto;
        box-sizing: border-box;
    }

     /*body.special {
        margin: 0px;

    body.envelope-theme {
        margin: 0;
        min-height:100vh;

        background-image: url("images/bg.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        color: #4a3030;
        font-family: "Special Elite", monospace;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    a {
    color: inherit;
    }


    .home {
        width: 850px;
        max-width: 90vw;

        height: 780px;
        max-height: 90vh;

        background: rgba(255, 241, 243, 0.94);

        border-radius: 35px;
        padding: 60px 70px;

        overflow-y: auto;
        
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    .home::-webkit-scrollbar {
        display: none;
    }

    .home h1 {
        margin: 0 0 10px;
        font-family: "Monsieur La Doulaise", cursive;
        font-size: 60px;
        font-weight: 400;
        text-align: center;
    }

    .home > p {
        margin: 0 0 45px;
        text-align: center;
    }

    .envelope-grid {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap:45px 60px;
        width: 650px;
        max-width: 100%;
        margin: 0 auto;
    }

    .envelope {
        width: 260px;
        justify-self: center;
        text-align: center;
        text-decoration: none;
        transition: transform 0.2 ease;
    }

    .envelope img{
        display: block;

        width: 250px;
        height: 185px;
        margin: 0 auto;

        object-fit: contain;
    }

    .envelope p{
        margin: 12px 0 0;
        font-size: 17px;
        line-height: 1.7;
    }

    .envelope:hover {
        transform: translateY(-6px)
    }

    .letter-container {
        position: relative;
        width: 700px;
        max-width: 90vw;
        margin-top: 30px;
    }

    .opening-gif{
        display: block;
        width: 100%;
        height: auto;
    }

    .letter-text {
        position: absolute;
        top: 50%;
        left: 50;

        transform: translate(-50%, -50%);

        width: 55%;

        text-align: center;
        opacity: 1;
        transition: opacity 1.5s ease;
    }

    .letter-text-hidden {
        opacity: 0 0 20px;
        font-size: 24px;
        font-weight: normal;
    }

    .letter-text h1{
        margin: 0 0 20px;
        font-size: 24px;
        font-weight: normal;

    }

    .letter-text p{
        margin: 0;
        font-size: 16px;
        line-height: 1.6px;
    }
    .back-link {
        margin-top: 30px;
        font-size: 14px;
        text-decoration: none;
    }

    .back-link:hover{
        text-decoration: underline;
    }

    /* mobile version */

    @media (max-width: 600px) {
    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px 0;
        padding-right: 0; /* Clears out the desktop padding-right */
    }

    .boxcontainer {
        width: 90vw;
        margin: 0 auto;
        box-sizing: border-box;
    }

    /* HOME */

    .home {
        width: 90vw;

        height: 80vh;

        padding: 40px 15px;

        border-radius: 25px;

        overflow-y: auto;

        /* Hide scrollbar */
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    .home::-webkit-scrollbar {
        display: none;
    }

    .home h1 {
        font-size: 42px;
    }

    .home > p {
        margin-bottom: 30px;
    }


    /* ENVELOPES */

    .envelope-grid {
        width: 100%;

        grid-template-columns: 1fr 1fr;

        gap: 30px 0;

        justify-items: center;
    }

    .envelope {
        width: 150px;

        justify-self: center;
    }

    .envelope img {
        width: 150px;
        height: 115px;
    }

    .envelope p {
        margin-top: 8px;

        font-size: 14px;
    }


    /* LETTER */

    .letter-page {
        padding: 30px 15px;
    }

    .letter-container {
        width: 95vw;

        margin-top: 20px;
    }

    .letter-text {
        width: 55%;
    }

    .letter-text h1 {
        margin-bottom: 12px;

        font-size: 18px;
    }

    .letter-text p {
        font-size: 12px;
        line-height: 1.5;
    }


    /* BACK LINK */

    .back-link {
        margin-top: 20px;

        font-size: 13px;
    }}


    body {
        margin:  0px;
        height: 100vh;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        background-color: white;
        font-family: arial,helvetica, sans-serif;
        overflow: hidden;
        padding-right: 200px;
        position: relative;
    }

     h1 {
            text-align: center;
            color: black;
            margin-top: 10px;
     }  

     .boxcontainer {
            max-width: 500px;
            width: 100%;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        input[type="text"] {
            width: 300px;
            height: 10px;
            font-size: 20px;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 20%;
            padding: 10px;
            margin-left: 10px;
            font-size: 16px;
            background-color: #2e08c6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .profile-img {
            border-radius: 10%;
            object-fit: cover;
            margin-right: 40px;
        }
        
        #answer {
            font-size: 20px;
            color: #010101;
            margin-top: 20px;
        }


    
</style>
<body>

    <img src="keeyy.png" alt="emoji" class="login-img">

    <div class="boxcontainer">
        <h1>Who are you?</h1>
        <input type="text" id="nameInput" placeholder="Enter your name...">
        <button onclick="submitName()">Submit</button>
        <div id="answer"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                loadEnvelopeGrid();
             }
        });
        function submitName() {
            const nameInput = document.getElementById('nameInput').value.toLowerCase().trim();
            const answerDiv = document.getElementById('answer');

            if (nameInput === "iyang ka tujing") {
                sessionStorage.setItem('isLoggedIn', 'true');
                answerDiv.textContent = `Hello, ${nameInput}! Welcome!`;
                const audio = new Audio('themesong.mp3');
                audio.play(); 

                loadEnvelopeGrid();

                
            } else if (nameInput === "nica") {
                answerDiv.textContent = 'Ngie engk(ˆ𐃷ˆ)'; }
            else if (nameInput === "nica joy") {
                answerDiv.textContent = `Hello, ${nameInput}! mali japon(,,•o•,,)`;
            }
            else if (nameInput === "nica joy maghinay") {
                answerDiv.textContent = `Hello, ${nameInput}! oops oops ooopss😝`;
            }
            else if (nameInput === "nica joy c. maghinay") {
                answerDiv.textContent = `Hello, ${nameInput}! cutie full name, pero wwwrrroonngg😝`;
            }
            else if (nameInput === "bae") {
                answerDiv.textContent = `Hello, ${nameInput}! depende kung 3 yan xoxoxo`;
            }
            else if (nameInput === "baby") {
                answerDiv.textContent = `Hello, ${nameInput}! yes naman pero no pa gyapun wkwkw`;
            }
            else if (nameInput === "love") {
                answerDiv.textContent = `Hello, ${nameInput}!ngie kinsa mana!😡`;
            }
            else if (nameInput === "secret") {
                answerDiv.textContent = `Hello, ${nameInput}! bahala ka dira😒`;
            }
            else if (nameInput === "kley") {
                answerDiv.textContent = `Hello, ${nameInput}!, uwaaat ako man si kley😶`;
            }
            else if (nameInput === "uyab nimo") {
                answerDiv.textContent = `Hello, ${nameInput}! ka sweeeeettt 💖💗🥰💞, pero mali po`;
            }
            else if (nameInput === "pinaka cute nga tao") {
                answerDiv.textContent = `Hello, ${nameInput}! tama pero mali?🤔`;
            }
            else {
                answerDiv.textContent = 'Please enter your name.';
            }
        }

            
        function loadEnvelopeGrid() {
            document.body.className = 'envelope-theme';
            document.body.innerHTML = `
            <main class="home">
                <h1>Open When...</h1>
                <p>Pick An Envelope</p>

                <section class="envelope-grid">
                    <a href="letter.html?letter=miss-you" class="envelope">
                        <img src="images/miss-you.png" alt="Open When You Miss Me" />
                        <p> You Miss Me</p>
                    </a>
                    <a href="letter.html?letter=bad-day" class="envelope">
                        <img src="images/bad-day.png" alt="Open When You Have a Bad Day" />
                        <p> You Have a Bad Day</p>
                    </a>
                    <a href="letter.html?letter=need-a-hug" class="envelope">
                        <img src="images/need-a-hug.png" alt="Open When You Need a Hug" />
                        <p> You Need a Hug</p>
                    </a>
                    <a href="letter.html?letter=cant-sleep" class="envelope">
                        <img src="images/cant-sleep.png" alt="Open When You Can't Sleep" />
                        <p> You Can't Sleep</p>
                    </a>
                    <a href="letter.html?letter=love-you" class="envelope">
                        <img src="images/love-you.png" alt="Open When Need To Know I Love You" />
                        <p> You Need Assurance</p>
                    </a>
                    <a href="letter.html?letter=thinking-of-you" class="envelope">
                        <img src="images/thinking-of-you.png" alt="Open When You're Thinking of Me" />
                        <p> You're Thinking of Me</p>
                    </a>
                </section>
            </main>
            `;
        }
    </script>
</body>
</html>
